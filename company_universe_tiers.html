let currentSearch = "";

const labels = {
  tracked: "Tracked",
  missing_mega: "Missing — mega-cap",
  missing_large: "Missing — large-cap"
};

function render() {
  const tbody = document.getElementById("table-body");
  const filtered = data.filter(r => {
    const matchesFilter = currentFilter === "all" || r.status === currentFilter;
    const matchesSearch = r.ticker.toLowerCase().includes(currentSearch.toLowerCase());
    return matchesFilter && matchesSearch;
  }).sort((a, b) => a.ticker.localeCompare(b.ticker));

  document.getElementById("results-count").textContent = filtered.length + " companies";
  tbody.innerHTML = filtered.map(r =>
    `<tr><td class="ticker">${r.ticker}</td><td><span class="badge badge-${r.status}">${labels[r.status]}</span></td></tr>`
  ).join("");
}

document.getElementById("search").addEventListener("input", e => {
  currentSearch = e.target.value;
  render();
});

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});
